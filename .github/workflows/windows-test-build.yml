name: Windows Test Build

# Unsigned Windows MSI for testing a branch, without the release secrets.
# Sign-in, sync and Trakt need NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64; when that
# secret is absent the build still succeeds and those features are disabled.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - "composeApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/windows-test-build.yml"

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 MSI
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      WEBVIEW2_VERSION: 1.0.4078.44
      LIBMPV_PATH: composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Fetch Windows libmpv runtime
        shell: bash
        run: |
          pull() { git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude="" "$@"; }
          size() { wc -c < "${LIBMPV_PATH}" 2>/dev/null || echo 0; }
          pull || true
          if (( $(size) < 1000000 )); then
            # Forks don't always carry the LFS objects; fall back to the upstream repository.
            echo "libmpv not in this repository's LFS store; fetching from upstream."
            git config lfs.url https://github.com/NuvioMedia/NuvioDesktop.git/info/lfs
            pull
          fi
          if (( $(size) < 1000000 )); then
            echo "The Windows libmpv runtime could not be fetched from Git LFS." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The action only saves its cache on the default branch unless told otherwise,
          # and these builds run on feature branches.
          cache-read-only: false

      - name: Configure runtime properties
        shell: bash
        run: |
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_[A-Z_]+|NUVIO_MACOS_[A-Z_]+)[[:space:]]*=/d' local.properties
            echo "Using runtime properties from the repository secret."
          else
            echo "::warning::NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 is not set; sign-in, sync and Trakt are disabled in this build."
            # The build declares local.properties as an input file, so it must exist even when empty.
            : > local.properties
          fi

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run desktop unit tests
        # Reported, but doesn't block producing the test MSI.
        continue-on-error: true
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:desktopTest `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            --no-configuration-cache `
            --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-windows-x64-${{ github.sha }}
          path: composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error
          retention-days: 14
